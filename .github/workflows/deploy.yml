name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs so a stale build never reaches the deploy queue
# (the deploy job's own concurrency group below only prevents overlap).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint -- --deny-warnings
      - run: npm run build
      - run: npm test
      - name: Smoke-check the build output
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }
          grep -q "/$REPO_NAME/assets/" dist/index.html || { echo "::error::dist/index.html does not reference /$REPO_NAME/assets/ - check base in vite.config.ts"; exit 1; }
          test -f dist/manifest.webmanifest || { echo "::error::dist/manifest.webmanifest missing - PWA plugin did not run"; exit 1; }
          grep -q "\"start_url\":\"/$REPO_NAME/\"" dist/manifest.webmanifest || { echo "::error::manifest start_url is not /$REPO_NAME/ - an installed app would launch at the wrong path"; exit 1; }
          test -f dist/sw.js || { echo "::error::dist/sw.js missing - service worker was not generated"; exit 1; }
          grep -q "manifest.webmanifest" dist/index.html || { echo "::error::dist/index.html does not link the web manifest"; exit 1; }
          grep -q 'url:"index.html"' dist/sw.js || { echo "::error::dist/sw.js does not precache index.html - offline navigation would 404"; exit 1; }
          test "$(grep -o 'url:"assets/[^"]*\.svg"' dist/sw.js | wc -l)" -ge 52 || { echo "::error::dist/sw.js precaches fewer than 52 card faces - cards would be missing offline (oversized or excluded assets?)"; exit 1; }
          grep -q 'url:"assets/solverWorker' dist/sw.js || { echo "::error::the solver worker chunk is not precached (or solverWorker.ts was renamed - update this pattern) - Solve would be the one feature that dies offline"; exit 1; }
      - name: Upload the site as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
